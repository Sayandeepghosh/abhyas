<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">

  <title>Abhyas — A little more focused, every day.</title>
  <link rel="icon" href="icon.svg" type="image/svg+xml"><link rel="manifest" href="manifest.webmanifest">

  <link rel="stylesheet" href="styles.css">
  <script src="app.js" defer></script>
</head>
<body>
  <a class="skip" href="#main">Skip to content</a>
  <aside class="sidebar" id="sidebar">
    <a class="brand" href="#dashboard" aria-label="Abhyas home"><span class="brand-symbol">a<span>•</span></span><span>abhyas<small>YOUR UPSC COMPANION</small></span></a>
    <div class="workspace-label">YOUR WORKSPACE</div>
    <nav id="navigation" aria-label="Main navigation"></nav>

    <footer>Built for the long journey.<span>A little more focused, every day.</span><button id="guide-button">Getting started ↗</button></footer>

  <div id="toast" class="toast" role="status" aria-live="polite"></div>
